{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ{% endblock %}
{% block content %}
<div class="form-box">
    <h1>เข้าสู่ระบบ 🔐</h1>
    <p>เข้าสู่ระบบเพื่อสั่งชานมและดูประวัติออเดอร์</p>
    <form method="post">
        <label>ชื่อผู้ใช้</label>
        <input name="username" required placeholder="username">
        <label>รหัสผ่าน</label>
        <input type="password" name="password" required placeholder="password">
        <button class="btn full" type="submit">เข้าสู่ระบบ</button>
    </form>
    <p>ยังไม่มีบัญชี? <a href="{{ url_for('register') }}">สมัครสมาชิกใหม่</a></p>
</div>
{% endblock %}
