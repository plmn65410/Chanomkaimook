{% extends "base.html" %}
{% block title %}สมัครสมาชิก{% endblock %}
{% block content %}
<div class="form-box">
    <h1>สร้างบัญชีใหม่ 👤</h1>
    <p>สมัครครั้งเดียว แล้วใช้บัญชีนี้สั่งชานมได้เลย</p>
    <form method="post">
        <label>ชื่อ-นามสกุล</label>
        <input name="full_name" required placeholder="เช่น สมชาย ใจดี">
        <label>เบอร์โทร</label>
        <input name="phone" placeholder="08xxxxxxxx">
        <label>ชื่อผู้ใช้</label>
        <input name="username" required placeholder="username">
        <label>รหัสผ่าน</label>
        <input type="password" name="password" required minlength="6" placeholder="อย่างน้อย 6 ตัวอักษร">
        <button class="btn full" type="submit">สมัครสมาชิก</button>
    </form>
    <p>มีบัญชีแล้ว? <a href="{{ url_for('login') }}">เข้าสู่ระบบ</a></p>
</div>
{% endblock %}
